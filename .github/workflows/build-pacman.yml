name: Build Pacman Packages (Clang and GCC)

on:
  workflow_call:

jobs:
  package-pacman:
    name: Build ${{ matrix.name }} Package (${{ matrix.compiler }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: archlinux
            name: Arch Linux
            image: archlinux:latest
            compiler: Clang
            cc: clang
            cxx: clang++
          - distro: manjaro
            name: Manjaro Linux
            image: manjarolinux/base:latest
            compiler: GCC
            cc: gcc
            cxx: g++
    container:
      image: ${{ matrix.image }}
      options: --privileged

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      DISTRO: ${{ matrix.distro }}

    steps:
      - name: Update System & Install Dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          if [ "$DISTRO" = manjaro ]; then
            pacman -S --noconfirm manjaro-keyring
          fi
          pacman -Syu --noconfirm --needed \
            base-devel \
            git \
            cmake \
            ninja \
            extra-cmake-modules \
            clang \
            qt6-base \
            kcoreaddons \
            ki18n \
            kconfig \
            kconfigwidgets \
            kio \
            okular \
            mupdf \
            openssl \
            nss \
            libseccomp \
            zlib \
            tesseract-data-eng \
            jq \
            sudo

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure package metadata
        run: |
          printf '%s\n' 'PACKAGER="l4rzy (github ci) <me@23ro.org>"' >> /etc/makepkg.conf

      - name: Build Package
        run: |
          if ! id -u builder > /dev/null 2>&1; then
            useradd -m builder
          fi
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd dist
          sudo -u builder CC="$CC" CXX="$CXX" makepkg -sf --noconfirm

      - name: Label package for distribution
        run: |
          for package in dist/okular-mupdf-ng-[0-9]*.pkg.tar.zst; do
            test -f "$package"
            mv "$package" "${package%.pkg.tar.zst}.${DISTRO}.pkg.tar.zst"
          done

      # Build and test both variants; publish only the patched bundled-MuPDF package.
      - name: Upload bundled-MuPDF package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.distro }}-package
          path: dist/okular-mupdf-ng-[0-9]*.${{ matrix.distro }}.pkg.tar.zst
          if-no-files-found: error
