name: Sanitizer

# ASan/LSan validation for every CI run, required before publishing releases.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanitizer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan:
    name: ASan/LSan worker tests
    runs-on: ubuntu-26.04
    container:
      image: ubuntu:26.04

    env:
      DEBIAN_FRONTEND: noninteractive
      CC: clang
      CXX: clang++

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            ca-certificates \
            clang \
            cmake \
            dpkg-dev \
            extra-cmake-modules \
            file \
            git \
            libbrotli-dev \
            libclang-rt-dev \
            libfreetype-dev \
            libharfbuzz-dev \
            libjbig2dec0-dev \
            libjpeg-dev \
            libnss3-dev \
            libnss3-tools \
            libopenjp2-7-dev \
            libseccomp-dev \
            llvm \
            mold \
            openssl \
            libkf6config-dev \
            libkf6configwidgets-dev \
            libkf6coreaddons-dev \
            libkf6i18n-dev \
            libkf6kio-dev \
            ninja-build \
            okular-dev \
            patch \
            pkg-config \
            python3 \
            qt6-base-dev \
            tesseract-ocr-eng \
            zlib1g-dev

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download bundled MuPDF source
        run: python3 ./scripts/download-mupdf.py

      - name: Build with sanitizers and run tests
        run: |
          test -f /usr/share/tesseract-ocr/5/tessdata/eng.traineddata
          ./scripts/build.sh asan \
            -DDISABLE_WORKER_SANDBOX=ON \
            -DTESSDATA_DIR=/usr/share/tesseract-ocr/5/tessdata
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=1
          ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer
