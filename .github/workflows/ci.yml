name: Tagged Release CI

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package-arch:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build-arch.yml

  package-deb-ubuntu:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build-deb-ubuntu.yml

  package-rpm-tumbleweed:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build-rpm-tumbleweed.yml

  package-rpm-fedora-arm:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build-rpm-fedora-arm.yml

  package-rpm-fedora:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build-rpm-fedora-44.yml

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package-arch, package-deb-ubuntu, package-rpm-tumbleweed, package-rpm-fedora-arm, package-rpm-fedora]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build tag-to-tag changelog
        id: changelog
        run: |
          set -eu
          new_tag="${GITHUB_REF_NAME}"
          # Newest-first version sort; the line after the current tag is the previous release.
          prev_tag=$(git tag --sort=-v:refname | awk -v current="$new_tag" '$0 == current { getline; print; exit }')
          if [ -n "$prev_tag" ]; then
            range="${prev_tag}..${new_tag}"
            header="Changes ${prev_tag} → ${new_tag}"
          else
            range="$new_tag"
            header="Changes in ${new_tag} (first release)"
          fi
          {
            echo "## ${header}"
            echo
            git log --no-merges --pretty='- %h %s (%an)' "$range"
          } > changelog.md
          cat changelog.md

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-package'
          path: release-assets
          merge-multiple: true

      - name: Attach packages to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.pkg.tar.zst
            release-assets/*.deb
            release-assets/*.rpm
          body_path: changelog.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
