name: CI

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package-arch:
    name: Build Arch Linux Package (Clang)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Update System & Install Dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm --needed \
            base-devel \
            git \
            cmake \
            ninja \
            extra-cmake-modules \
            clang \
            qt6-base \
            qt6-5compat \
            qt6-declarative \
            kcoreaddons \
            ki18n \
            kconfig \
            kconfigwidgets \
            kio \
            kiconthemes \
            okular \
            mupdf \
            mujs \
            openssl \
            nss \
            libseccomp \
            zlib \
            tesseract \
            tesseract-data-eng \
            jq \
            sudo

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Arch Linux Package
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd dist
          sudo -u builder CC=clang CXX=clang++ makepkg -sf --noconfirm

      - name: Upload Arch Linux package
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  package-deb:
    name: Build Debian Package (Ubuntu 26.04)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04

    env:
      DEBIAN_FRONTEND: noninteractive
      CC: clang
      CXX: clang++

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            ca-certificates \
            clang \
            cmake \
            dpkg-dev \
            extra-cmake-modules \
            file \
            git \
            libbrotli-dev \
            libfreetype-dev \
            libharfbuzz-dev \
            libjbig2dec0-dev \
            libjpeg-dev \
            libleptonica-dev \
            libnss3-dev \
            libopenjp2-7-dev \
            libseccomp-dev \
            libkf6config-dev \
            libkf6configwidgets-dev \
            libkf6coreaddons-dev \
            libkf6i18n-dev \
            libkf6kio-dev \
            ninja-build \
            okular-dev \
            pkg-config \
            python3 \
            qt6-base-dev \
            tesseract-ocr \
            zlib1g-dev

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download bundled MuPDF source
        run: python3 ./scripts/download-mupdf.py

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DKDE_INSTALL_USE_QT_SYS_PATHS=ON \
            -DUSE_SYSTEM_MUPDF=OFF \
            -DBUILD_TESTING=OFF \
            -DENABLE_MU_DEBUG=OFF \
            -DTESSDATA_DIR=/usr/share/tesseract-ocr/5/tessdata

      - name: Build Debian package
        run: |
          cmake --build build -j$(nproc)
          cpack --config build/CPackConfig.cmake -B build/packages -G DEB
          package=$(find build/packages -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          package_name=$(dpkg-deb --field "$package" Package)
          package_version=$(dpkg-deb --field "$package" Version)
          package_architecture=$(dpkg-deb --field "$package" Architecture)
          mv "$package" "build/packages/${package_name}_${package_version}_${package_architecture}_ubuntu-26.04.deb"

      - name: Validate Debian package
        run: |
          set -x
          expected_version=$(python3 -c 'import json; print(json.load(open("src/generator/libokularGenerator_mupdfng.json"))["KPlugin"]["Version"])')
          package="build/packages/okular-mupdf-ng_${expected_version}-1_amd64_ubuntu-26.04.deb"
          test -f "$package"
          test "$(dpkg-deb --field "$package" Package)" = okular-mupdf-ng
          test "$(dpkg-deb --field "$package" Version)" = "${expected_version}-1"
          test "$(dpkg-deb --field "$package" Architecture)" = amd64
          dependencies=$(dpkg-deb --field "$package" Depends)
          printf '%s\n' "$dependencies" | grep -Eq '(^|, )okular([ (]|,|$)'
          printf '%s\n' "$dependencies" | grep -Eq '(^|, )tesseract-ocr([ (]|,|$)'
          dpkg-deb --contents "$package" | grep -q '/okular_generators/okularGenerator_mupdfng\.so$'
          dpkg-deb --contents "$package" | grep -q '/okular-mupdf-ng/okular-mupdf-worker$'
          dpkg-deb --contents "$package" | grep -q '/mupdfsettings\.kcfg$'
          dpkg-deb --contents "$package" | grep -q '/icons/hicolor/512x512/apps/mupdfng\.png$'
          dpkg-deb --contents "$package" | grep -q '/doc/okular-mupdf-ng/copyright$'
          dpkg-deb --info "$package"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: build/packages/*.deb
          if-no-files-found: error

  package-rpm:
    name: Build openSUSE Tumbleweed RPM (Clang)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container:
      image: opensuse/tumbleweed:latest

    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Install build dependencies
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install --no-recommends \
            ca-certificates \
            clang \
            cmake \
            kf6-extra-cmake-modules \
            file \
            freetype2-devel \
            gcc-c++ \
            git \
            harfbuzz-devel \
            jbig2dec-devel \
            kf6-kconfig-devel \
            kf6-kconfigwidgets-devel \
            kf6-kcoreaddons-devel \
            kf6-ki18n-devel \
            kf6-kio-devel \
            leptonica-devel \
            libbrotli-devel \
            libjpeg8-devel \
            libseccomp-devel \
            make \
            ninja \
            mozilla-nss-devel \
            okular-devel \
            openjpeg2-devel \
            pkgconf-pkg-config \
            python314-base \
            rpm-build \
            tesseract-ocr \
            tesseract-ocr-traineddata-eng \
            qt6-base-devel \
            zlib-devel

      - name: Provide Python 3 command
        run: |
          ln --symbolic --force /usr/bin/python3.14 /usr/local/bin/python3
          test "$(command -v python3)" = /usr/local/bin/python3
          test "$(readlink -f "$(command -v python3)")" = /usr/bin/python3.14
          python3 -c 'import sys; assert sys.version_info >= (3, 12)'

      - name: Verify OCR language data
        run: test -f /usr/share/tessdata/eng.traineddata

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download bundled MuPDF source
        run: python3 ./scripts/download-mupdf.py

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DKDE_INSTALL_USE_QT_SYS_PATHS=ON \
            -DUSE_SYSTEM_MUPDF=OFF \
            -DUSE_SYSTEM_GUMBO=OFF \
            -DBUILD_TESTING=OFF \
            -DENABLE_MU_DEBUG=OFF \
            -DTESSDATA_DIR=/usr/share/tessdata

      - name: Build RPM package
        run: |
          cmake --build build -j$(nproc)
          cpack --config build/CPackConfig.cmake -B build/packages -G RPM
          package=$(find build/packages -maxdepth 1 -name '*.rpm' -print -quit)
          test -n "$package"
          package_name=$(rpm --queryformat '%{NAME}' -qp "$package")
          package_version=$(rpm --queryformat '%{VERSION}' -qp "$package")
          package_release=$(rpm --queryformat '%{RELEASE}' -qp "$package")
          package_architecture=$(rpm --queryformat '%{ARCH}' -qp "$package")
          mv "$package" "build/packages/${package_name}-${package_version}-${package_release}.opensuse-tumbleweed.${package_architecture}.rpm"

      - name: Validate RPM package
        run: |
          set -x
          expected_version=$(python3 -c 'import json; print(json.load(open("src/generator/libokularGenerator_mupdfng.json"))["KPlugin"]["Version"])')
          package="build/packages/okular-mupdf-ng-${expected_version}-1.opensuse-tumbleweed.x86_64.rpm"
          test -f "$package"
          test "$(rpm --queryformat '%{NAME}' -qp "$package")" = okular-mupdf-ng
          test "$(rpm --queryformat '%{VERSION}-%{RELEASE}' -qp "$package")" = "${expected_version}-1"
          test "$(rpm --queryformat '%{ARCH}' -qp "$package")" = x86_64
          requirements=$(rpm --requires -qp "$package")
          printf '%s\n' "$requirements" | grep -Fx okular
          printf '%s\n' "$requirements" | grep -Fx tesseract-ocr
          printf '%s\n' "$requirements" | grep -Fx tesseract-ocr-traineddata-eng
          rpm --list -qp "$package" | grep -q '/okular_generators/okularGenerator_mupdfng\.so$'
          rpm --list -qp "$package" | grep -q '/okular-mupdf-ng/okular-mupdf-worker$'
          rpm --list -qp "$package" | grep -q '/mupdfsettings\.kcfg$'
          rpm --list -qp "$package" | grep -q '/icons/hicolor/512x512/apps/mupdfng\.png$'
          rpm --list -qp "$package" | grep -q '/doc/okular-mupdf-ng/copyright$'
          rpm --checksig "$package"
          rpm --info -qp "$package"

      - name: Upload openSUSE RPM package
        uses: actions/upload-artifact@v4
        with:
          name: opensuse-tumbleweed-rpm-package
          path: build/packages/*.rpm
          if-no-files-found: error

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package-arch, package-deb, package-rpm]
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-package'
          path: release-assets
          merge-multiple: true

      - name: Attach packages to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.pkg.tar.zst
            release-assets/*.deb
            release-assets/*.rpm
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
