name: CI

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (Clang - Debug)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    env:
      QT_QPA_PLATFORM: offscreen
      CC: clang
      CXX: clang++

    steps:
      - name: Update System & Install Dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm --needed \
            base-devel \
            git \
            cmake \
            ninja \
            extra-cmake-modules \
            clang \
            qt6-base \
            qt6-5compat \
            qt6-declarative \
            kcoreaddons \
            ki18n \
            kconfig \
            kconfigwidgets \
            kio \
            kiconthemes \
            okular \
            mupdf \
            mujs \
            openssl \
            nss \
            libseccomp \
            zlib \
            tesseract \
            tesseract-data-eng \
            appstream

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=OFF \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER=clang \
            -DENABLE_MU_DEBUG=ON

      - name: Compile Project
        run: |
          cmake --build build -j$(nproc)

  package-and-release:
    name: Build Arch Package & Release (Clang)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Update System & Install Dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm --needed \
            base-devel \
            git \
            cmake \
            ninja \
            extra-cmake-modules \
            clang \
            qt6-base \
            qt6-5compat \
            qt6-declarative \
            kcoreaddons \
            ki18n \
            kconfig \
            kconfigwidgets \
            kio \
            kiconthemes \
            okular \
            mupdf \
            mujs \
            openssl \
            nss \
            libseccomp \
            zlib \
            tesseract \
            tesseract-data-eng \
            jq \
            sudo

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Arch Linux Package
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd dist
          sudo -u builder CC=clang CXX=clang++ makepkg -sf --noconfirm

      - name: Attach Package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pkg.tar.zst
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
