name: Tagged Release CI

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package-arch:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build-arch.yml

  package-deb:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build-deb.yml

  package-rpm-tumbleweed:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build-rpm-tumbleweed.yml

  package-rpm-fedora-arm:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build-rpm-fedora-asahi.yml

  package-rpm-fedora-x64:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build-rpm-fedora-44.yml

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package-arch, package-deb, package-rpm-tumbleweed, package-rpm-fedora-arm, package-rpm-fedora-x64]
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-package'
          path: release-assets
          merge-multiple: true

      - name: Attach packages to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.pkg.tar.zst
            release-assets/*.deb
            release-assets/*.rpm
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
