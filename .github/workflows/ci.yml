name: Build and Release CI

on:
  push:
    branches: [ '**' ]
    tags: [ '**' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-build:
    name: Check whether to build
    runs-on: ubuntu-26.04
    outputs:
      build: ${{ steps.decision.outputs.build }}
    steps:
      - name: Checkout branch with tags
        if: github.event_name == 'push' && github.ref_type == 'branch'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Skip branch builds for tagged commits
        id: decision
        shell: bash
        run: |
          build=true
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == branch ]]; then
            tags=$(git tag --points-at "$GITHUB_SHA")
            if [[ -n "$tags" ]]; then
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  sanitizer:
    needs: check-build
    if: needs.check-build.outputs.build == 'true'
    uses: ./.github/workflows/sanitize.yml

  package-pacman:
    needs: check-build
    if: needs.check-build.outputs.build == 'true'
    uses: ./.github/workflows/build-pacman.yml

  package-deb-ubuntu:
    needs: check-build
    if: needs.check-build.outputs.build == 'true'
    uses: ./.github/workflows/build-deb-ubuntu.yml

  package-deb-debian:
    needs: check-build
    if: needs.check-build.outputs.build == 'true'
    uses: ./.github/workflows/build-deb-debian.yml

  package-rpm-tumbleweed:
    needs: check-build
    if: needs.check-build.outputs.build == 'true'
    uses: ./.github/workflows/build-rpm-tumbleweed.yml

  package-rpm-fedora-arm:
    needs: check-build
    if: needs.check-build.outputs.build == 'true'
    uses: ./.github/workflows/build-rpm-fedora-arm.yml

  package-rpm-fedora:
    needs: check-build
    if: needs.check-build.outputs.build == 'true'
    uses: ./.github/workflows/build-rpm-fedora-44.yml

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [sanitizer, package-pacman, package-deb-ubuntu, package-deb-debian, package-rpm-tumbleweed, package-rpm-fedora-arm, package-rpm-fedora]
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build tag-to-tag changelog
        id: changelog
        run: |
          set -eu
          new_tag="${GITHUB_REF_NAME}"
          # Newest-first version sort; the line after the current tag is the previous release.
          prev_tag=$(git tag --sort=-v:refname | awk -v current="$new_tag" '$0 == current { getline; print; exit }')
          if [ -n "$prev_tag" ]; then
            range="${prev_tag}..${new_tag}"
            header="Changes ${prev_tag} → ${new_tag}"
          else
            range="$new_tag"
            header="Changes in ${new_tag} (first release)"
          fi
          {
            echo "## ${header}"
            echo
            git log --no-merges --pretty='- %h %s (%an)' "$range"
          } > changelog.md
          cat changelog.md

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-package'
          path: release-assets
          merge-multiple: true

      - name: Attach packages to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/okular-mupdf-ng-[0-9]*.pkg.tar.zst
            release-assets/*.deb
            release-assets/*.rpm
          body_path: changelog.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-install:
    name: Update installation instructions
    needs: release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    concurrency:
      group: update-install
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update package versions
        run: |
          # Ignore prereleases and older releases when rerunning publication.
          latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$latest_tag" != "$RELEASE_TAG" ]; then
            exit 0
          fi
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = re.fullmatch(r"v(\d+\.\d+\.\d+)", tag)
          if not version:
              raise SystemExit("Expected a release tag in vMAJOR.MINOR.PATCH format")
          path = Path("INSTALL.md")
          packages, separator, rest = path.read_text().partition("## Requirements to build")
          current = re.search(r"below install v(\d+\.\d+\.\d+)\.", packages)
          if not current or not separator:
              raise SystemExit("Cannot find the installation version or package section")
          packages = re.sub(
              rf"(?<![\d.]){re.escape(current[1])}(?!\d|\.\d)", version[1], packages
          )
          path.write_text(packages + separator + rest)
          PY

      - name: Commit installation update
        run: |
          git add INSTALL.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update installation commands for $RELEASE_TAG"
          git push origin "HEAD:$DEFAULT_BRANCH"
