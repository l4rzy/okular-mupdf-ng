name: Build and Release CI

on:
  push:
    branches: [ '**' ]
    tags: [ '**' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-build:
    name: Check whether to build
    runs-on: ubuntu-26.04
    outputs:
      build: ${{ steps.decision.outputs.build }}
    steps:
      - name: Checkout branch with tags
        if: github.event_name == 'push' && github.ref_type == 'branch'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Skip branch builds for tagged commits
        id: decision
        shell: bash
        run: |
          build=true
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == branch ]]; then
            tags=$(git tag --points-at "$GITHUB_SHA")
            if [[ -n "$tags" ]]; then
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  sanitizer:
    needs: check-build
    if: needs.check-build.outputs.build == 'true'
    uses: ./.github/workflows/sanitize.yml

  package-pacman:
    needs: check-build
    if: needs.check-build.outputs.build == 'true'
    uses: ./.github/workflows/build-pacman.yml

  package-deb-ubuntu:
    needs: check-build
    if: needs.check-build.outputs.build == 'true'
    uses: ./.github/workflows/build-deb-ubuntu.yml

  package-deb-debian:
    needs: check-build
    if: needs.check-build.outputs.build == 'true'
    uses: ./.github/workflows/build-deb-debian.yml

  package-rpm-tumbleweed:
    needs: check-build
    if: needs.check-build.outputs.build == 'true'
    uses: ./.github/workflows/build-rpm-tumbleweed.yml

  package-rpm-fedora:
    needs: check-build
    if: needs.check-build.outputs.build == 'true'
    uses: ./.github/workflows/build-rpm-fedora.yml

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [sanitizer, package-pacman]
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare release notes
        run: |
          set -eu
          new_tag="${GITHUB_REF_NAME}"
          if [[ "$new_tag" =~ ^v[0-9]+\.[0-9]+\.0$ ]]; then
            test -s CHANGELOG.md
            cp CHANGELOG.md release-notes.md
          else
            # Newest-first version sort; the line after the current tag is the previous release.
            prev_tag=$(git tag --sort=-v:refname | awk -v current="$new_tag" '$0 == current { getline; print; exit }')
            if [ -n "$prev_tag" ]; then
              range="${prev_tag}..${new_tag}"
              header="Changes ${prev_tag} → ${new_tag}"
            else
              range="$new_tag"
              header="Changes in ${new_tag} (first release)"
            fi
            {
              echo "## ${header}"
              echo
              git log --no-merges --pretty='- %h %s (%an)' "$range"
            } > release-notes.md
          fi
          cat release-notes.md

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-package'
          path: release-assets
          merge-multiple: true

      - name: Attach packages to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/okular-mupdf-ng-[0-9]*.pkg.tar.zst
          body_path: release-notes.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
