name: Build Debian Package (Ubuntu 26.04)

on:
  workflow_call:

jobs:
  package-deb:
    name: Build Debian Package (Ubuntu 26.04)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04

    env:
      DEBIAN_FRONTEND: noninteractive
      CC: clang
      CXX: clang++

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            ca-certificates \
            clang \
            cmake \
            dpkg-dev \
            extra-cmake-modules \
            file \
            git \
            libbrotli-dev \
            libfreetype-dev \
            libharfbuzz-dev \
            libjbig2dec0-dev \
            libjpeg-dev \
            libleptonica-dev \
            libnss3-dev \
            libnss3-tools \
            libopenjp2-7-dev \
            libseccomp-dev \
            mold \
            openssl \
            libkf6config-dev \
            libkf6configwidgets-dev \
            libkf6coreaddons-dev \
            libkf6i18n-dev \
            libkf6kio-dev \
            ninja-build \
            okular-dev \
            pkg-config \
            python3 \
            qt6-base-dev \
            zlib1g-dev

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download bundled MuPDF source
        run: python3 ./scripts/download-mupdf.py

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DKDE_INSTALL_USE_QT_SYS_PATHS=ON \
            -DCMAKE_LINKER_TYPE=MOLD \
            -DUSE_SYSTEM_MUPDF=OFF \
            -DBUILD_TESTING=ON \
            -DENABLE_MU_DEBUG=OFF \
            -DTESSDATA_DIR=/usr/share/tesseract-ocr/5/tessdata

      - name: Build Debian package
        run: |
          cmake --build build -j$(nproc)
          cpack --config build/CPackConfig.cmake -B build/packages -G DEB
          package=$(find build/packages -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          package_name=$(dpkg-deb --field "$package" Package)
          package_version=$(dpkg-deb --field "$package" Version)
          package_architecture=$(dpkg-deb --field "$package" Architecture)
          mv "$package" "build/packages/${package_name}_${package_version}_${package_architecture}_ubuntu-26.04.deb"

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Validate Debian package
        run: |
          set -x
          expected_version=$(python3 -c 'import json; print(json.load(open("src/generator/manifest.json"))["KPlugin"]["Version"])')
          package="build/packages/okular-mupdf-ng_${expected_version}-1_amd64_ubuntu-26.04.deb"
          test -f "$package"
          test "$(dpkg-deb --field "$package" Package)" = okular-mupdf-ng
          test "$(dpkg-deb --field "$package" Version)" = "${expected_version}-1"
          test "$(dpkg-deb --field "$package" Architecture)" = amd64
          dependencies=$(dpkg-deb --field "$package" Depends)
          printf '%s\n' "$dependencies" | grep -Eq '(^|, )okular([ (]|,|$)'
          dpkg-deb --contents "$package" | grep -q '/okular_generators/okularGenerator_mupdfng\.so$'
          dpkg-deb --contents "$package" | grep -q '/okular-mupdf-ng/okular-mupdf-worker$'
          dpkg-deb --contents "$package" | grep -q '/mupdfsettings\.kcfg$'
          dpkg-deb --contents "$package" | grep -q '/icons/hicolor/512x512/apps/mupdfng\.png$'
          dpkg-deb --contents "$package" | grep -q '/doc/okular-mupdf-ng/copyright$'
          dpkg-deb --info "$package"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: build/packages/*.deb
          if-no-files-found: error
