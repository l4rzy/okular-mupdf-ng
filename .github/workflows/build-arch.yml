name: Build Arch Linux Package (Clang)

on:
  workflow_call:

jobs:
  package-arch:
    name: Build Arch Linux Package (Clang)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Update System & Install Dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm --needed \
            base-devel \
            git \
            cmake \
            ninja \
            extra-cmake-modules \
            clang \
            qt6-base \
            qt6-5compat \
            qt6-declarative \
            kcoreaddons \
            ki18n \
            kconfig \
            kconfigwidgets \
            kio \
            kiconthemes \
            okular \
            mupdf \
            mujs \
            openssl \
            nss \
            libseccomp \
            zlib \
            tesseract \
            tesseract-data-eng \
            jq \
            sudo

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Arch Linux Package
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd dist
          sudo -u builder CC=gcc CXX=g++ makepkg -sf --noconfirm

      - name: Upload Arch Linux package
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
