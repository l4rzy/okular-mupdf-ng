# Native library-only vendoring of boko 0.6.0, GPL-3.0-or-later (see LICENSE).
# Upstream: https://github.com/zacharydenton/boko
# Original crates.io archive SHA-256:
# 636e79e6b285c0ee6175d99c0f18f8c9bf553c9921d5474730c8424d8e7da22f
# Local fixes preserve aid anchors and validate stylesheet flow bounds.
# CSS resource rewriting is now upstream. Regression tests live in
# src/worker/engine/kindle/src/lib.rs and tests/worker/mobi.cpp.
# CLI, browser bindings, and standalone test/example/benchmark targets are omitted.

[package]
name = "boko"
version = "0.6.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
repository = "https://github.com/zacharydenton/boko"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]
test = false
doctest = false

[features]
default = []
parallel = ["dep:rayon"]
optimize-images = ["dep:image"]

[dependencies]
base64 = "0.23.1"
bstr = { version = "1.13.1", default-features = false, features = ["alloc"] }
cssparser = "0.38.0"
encoding_rs = "0.8.44"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
html5ever = "0.40.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }
memchr = "2.8.3"
percent-encoding = "2.3.2"
precomputed-hash = "0.1.1"
quick-xml = "0.42.0"
rayon = { version = "1.12.0", optional = true }
rustc-hash = "2.1.3"
selectors = "0.42.0"
sha1_smol = { version = "1.0.1", features = ["std"] }
skrifa = { version = "0.49.0", default-features = false, features = ["std"] }
smallvec = "1.16.4"
thiserror = "2.0.21"
xml5ever = "0.40.0"
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2"] }
